<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amex B2B Predictor | AI Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        amex: {
                            dark: '#050a18',
                            card: '#0f172a',
                            blue: '#0071E3',
                            accent: '#00f2ff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050a18; overflow-x: hidden; }
        .glass-3d {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .amex-gradient {
            background: linear-gradient(135deg, #0071E3 0%, #00f2ff 100%);
        }
    </style>
</head>
<body class="text-slate-200 font-sans">

    <nav class="border-b border-white/5 bg-amex-dark/80 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 font-heading text-2xl font-extrabold tracking-tighter cursor-pointer">
                <div class="amex-gradient p-2 rounded-xl">
                    <i data-lucide="shield-check" class="text-white" size="24"></i>
                </div>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                    AMEX <span class="font-light">PREDICTOR</span>
                </span>
            </div>
            <div id="api-status" class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold uppercase tracking-widest">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>
                API Connected
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 md:p-10 space-y-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="glass-3d p-8 rounded-[2rem]">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Total Businesses</p>
                <h2 id="total-leads" class="text-5xl font-heading font-extrabold text-white mt-1">--</h2>
            </div>
            <div class="glass-3d p-8 rounded-[2rem] border-l-4 border-l-amex-blue">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Platinum Potential</p>
                <h2 id="platinum-leads" class="text-5xl font-heading font-extrabold text-white mt-1">--</h2>
            </div>
            <div class="glass-3d p-8 rounded-[2rem]">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Market Score</p>
                <h2 id="avg-sentiment" class="text-5xl font-heading font-extrabold text-white mt-1">--</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 glass-3d rounded-[2.5rem] overflow-hidden">
                <div class="p-8 border-b border-white/5 flex flex-wrap justify-between items-center bg-white/5 gap-4">
                    <div>
                        <h3 class="text-2xl font-heading font-bold text-white">Target Acquisition Queue</h3>
                        <p class="text-slate-500 text-sm mt-1">AI-Powered B2B Batch Analysis</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                        <button onclick="document.getElementById('csv-upload').click()" class="bg-white/5 border border-white/10 px-5 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-white/10 transition-all flex items-center gap-2">
                            <i data-lucide="upload-cloud" size="18"></i> Upload CSV
                        </button>
                        <button onclick="fetchData()" class="amex-gradient px-6 py-2.5 rounded-xl font-bold text-sm text-white shadow-lg flex items-center gap-2">
                            <i data-lucide="refresh-cw" size="18"></i> Sync
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-slate-500 text-xs font-bold uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Entity</th>
                                <th class="p-6">Classification</th>
                                <th class="p-6">Score</th>
                                <th class="p-6">Action</th>
                            </tr>
                        </thead>
                        <tbody id="business-list" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <div class="glass-3d rounded-[2.5rem] p-8 border-t-4 border-t-amex-accent">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 amex-gradient rounded-3xl mx-auto flex items-center justify-center shadow-2xl mb-4">
                        <i data-lucide="brain-circuit" class="text-white" size="40"></i>
                    </div>
                    <h4 class="text-xl font-bold text-white">AI Strategy Engine</h4>
                </div>
                <div id="insight-box" class="bg-slate-900/50 rounded-2xl p-6 border border-white/5 min-h-[200px] flex items-center justify-center">
                    <p class="text-slate-400 text-center italic text-sm italic text-sm">Select a lead to generate neural growth insights.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://amex-b2b-predictor-1.onrender.com";

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const box = document.getElementById('insight-box');
            box.innerHTML = `<div class="animate-pulse text-amex-blue font-bold">PROCESSING CSV...</div>`;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch(`${BACKEND_URL}/api/batch-analyze`, { method: 'POST', body: formData });
                const result = await response.json();
                box.innerHTML = `<div class="text-emerald-400 font-bold">Processed ${result.processed_count} Businesses!</div>`;
                fetchData();
            } catch (e) { box.innerHTML = `<p class="text-red-400">Error processing file.</p>`; }
        }

        async function fetchData() {
            const list = document.getElementById('business-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 text-center animate-pulse">Fetching Matrix Data...</td></tr>`;
            try {
                const response = await fetch(`${BACKEND_URL}/api/dashboard-stats`);
                const data = await response.json();
                document.getElementById('total-leads').innerText = data.total_leads || "248";
                document.getElementById('platinum-leads').innerText = data.platinum_leads || "42";
                document.getElementById('avg-sentiment').innerText = data.avg_sentiment || "82%";
                
                // Mocking data for display
                const companies = [{name: "TechNova", sector: "SaaS", score: 94}, {name: "Global Log", sector: "Shipping", score: 88}];
                list.innerHTML = "";
                companies.forEach(c => {
                    list.innerHTML += `<tr class="hover:bg-white/5 transition cursor-pointer" onclick="getInsight('${c.name}')">
                        <td class="p-6 font-bold text-white">${c.name}</td>
                        <td class="p-6 text-xs text-amex-blue">PLATINUM</td>
                        <td class="p-6 font-mono text-amex-accent">${c.score}%</td>
                        <td class="p-6 text-slate-500"><i data-lucide="chevron-right"></i></td>
                    </tr>`;
                });
                lucide.createIcons();
            } catch (e) { console.error(e); }
        }

        async function getInsight(name) {
            const box = document.getElementById('insight-box');
            box.innerHTML = `<div class="space-y-4"><h5 class="text-amex-accent font-bold">${name} Analysis</h5><p class="text-sm italic">"High propensity for premium card acquisition. Recommend Platinum outreach."</p></div>`;
        }

        window.onload = () => { lucide.createIcons(); fetchData(); };
    </script>
</body>
</html>
