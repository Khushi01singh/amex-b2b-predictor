<div class="p-8 border-b border-white/5 flex flex-wrap justify-between items-center bg-white/5 gap-4">
    <div>
        <h3 class="text-2xl font-heading font-bold text-white">Target Acquisition Queue</h3>
        <p class="text-slate-500 text-sm mt-1">Real-time B2B analysis based on NLP sentiment</p>
    </div>
    <div class="flex items-center gap-3">
        <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
        
        <button onclick="document.getElementById('csv-upload').click()" class="bg-white/5 border border-white/10 px-5 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-white/10 hover:text-white transition-all flex items-center gap-2">
            <i data-lucide="upload-cloud" size="18"></i>
            Upload B2B CSV
        </button>

        <button onclick="fetchData()" class="amex-gradient px-6 py-2.5 rounded-xl font-bold text-sm text-white hover:scale-105 active:scale-95 transition-all shadow-lg flex items-center gap-2">
            <i data-lucide="refresh-cw" size="18"></i>
            Sync Data
        </button>
    </div>
</div>

<script>
    const BACKEND_URL = "https://amex-b2b-predictor-1.onrender.com";

    // --- Naya Feature: CSV Upload Handling ---
    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // UI ko loading state mein daalna
        const box = document.getElementById('insight-box');
        box.innerHTML = `
            <div class="text-center space-y-3">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-amex-accent"></div>
                <p class="text-amex-accent text-xs font-black uppercase tracking-widest">Processing Batch CSV...</p>
            </div>
        `;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch(`${BACKEND_URL}/api/batch-analyze`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            
            // Success Message
            box.innerHTML = `
                <div class="text-center animate-in zoom-in duration-300">
                    <div class="text-emerald-400 mb-2"><i data-lucide="check-circle" size="40" class="mx-auto"></i></div>
                    <p class="text-white font-bold">Batch Complete!</p>
                    <p class="text-slate-500 text-xs">${result.processed_count || 0} Entities Processed</p>
                </div>
            `;
            
            lucide.createIcons();
            fetchData(); // Table refresh karna naye data ke sath
            
        } catch (error) {
            console.error("Upload Error:", error);
            box.innerHTML = `<p class="text-red-400 text-xs italic">Error processing CSV. Ensure columns match requirements.</p>`;
        }
    }

    // ... baaki fetchData aur getInsight functions wahi rahenge jo pehle the ...
</script>
